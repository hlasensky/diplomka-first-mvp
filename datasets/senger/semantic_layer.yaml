version: 1

domain:
  name: beeobserver
  description: >
    Sensor data from 78 honey bee colonies in Germany (2019-2022): hive weight,
    in-hive temperature at five positions, outside temperature, humidity and pressure.
    Beekeeper inspection events are incomplete: a beekeeper may have missed an event,
    so the absence of an event is not evidence that it did not happen.
  notes:
    - "Temperatures are in °C, weights in kg, humidity in %, pressure in hPa."
    - "Events come from beekeeper inspections (2019-2023) and are incomplete."
  source: "Senger et al., Data in Brief 52 (2024) 110015; Zenodo 10.5281/zenodo.10407693"

glossary:
  - term: swarming
    synonyms: [swarm, swarm event, colony swarmed]
    maps_to: {dimension: event, level: event_type, value: swarming}
  - term: honey harvest
    synonyms: [harvest, honey extraction, honey removal]
    maps_to: {dimension: event, level: event_type, value: honey}
  - term: colony death
    synonyms: [colony loss, dead colony, colony died]
    maps_to: {dimension: event, level: event_type, value: died}
  - term: queen cell
    synonyms: [swarm cell, supersedure cell]
    maps_to: {dimension: event, level: event_type, value: queencell}
  - term: feeding
    synonyms: [supplementary feeding, sugar syrup]
    maps_to: {dimension: event, level: event_type, value: feeding}
  - term: nectar flow
    synonyms: [honey flow, forage flow]
    maps_to: {measure: weight_gain_kg, note: "positive daily weight gain"}
  - term: brood nest temperature
    synonyms: [center temperature, core temperature]
    maps_to: {measure: t_center}

tables:
  fact_hive_hourly:
    kind: fact
    grain: [colony_key, time_key]
    description: Hourly sensor averages of one hive.
  fact_temperature:
    kind: fact
    grain: [colony_key, time_key, sensor_pos]
    description: Long-format temperatures for drill-down to sensor position.
  agg_colony_daily:
    kind: aggregate
    grain: [colony_key, date]
    derived_from: fact_hive_hourly
    description: Daily aggregates per colony; input for anomaly detection.
  fact_event:
    kind: factless_fact
    grain: [colony_key, event_ts, event_type]
    description: Events recorded by beekeepers during inspections; incomplete.
  dim_time: {kind: dimension}
  dim_colony: {kind: dimension}
  dim_cell: {kind: dimension}
  dim_sensor_position: {kind: dimension}
  dim_event_type: {kind: dimension}

joins:
  - {left: fact_hive_hourly.colony_key, right: dim_colony.colony_key, cardinality: many_to_one}
  - {left: fact_hive_hourly.time_key, right: dim_time.time_key, cardinality: many_to_one}
  - {left: fact_temperature.colony_key, right: dim_colony.colony_key, cardinality: many_to_one}
  - {left: fact_temperature.time_key, right: dim_time.time_key, cardinality: many_to_one}
  - {left: fact_temperature.sensor_pos, right: dim_sensor_position.sensor_pos, cardinality: many_to_one}
  - {left: agg_colony_daily.colony_key, right: dim_colony.colony_key, cardinality: many_to_one}
  - {left: agg_colony_daily.date, right: dim_time.date, cardinality: one_to_many, note: "aggregate dim_time to date first"}
  - {left: fact_event.colony_key, right: dim_colony.colony_key, cardinality: many_to_one}
  - {left: fact_event.event_type, right: dim_event_type.event_type, cardinality: many_to_one}
  - left: "date_trunc('hour', fact_event.event_ts)"
    right: dim_time.time_key
    cardinality: many_to_one
    note: "dim_time has one row per HOUR: never join it on date, that multiplies rows by 24; or use year(event_ts) etc. directly"
  - {left: dim_colony.cell_id, right: dim_cell.cell_id, cardinality: many_to_one}
  - left: fact_hive_hourly
    right: fact_event
    type: asof
    on: "fact_hive_hourly.colony_key = fact_event.colony_key AND fact_hive_hourly.time_key >= fact_event.event_ts"
    note: "The only allowed row-level join between these two facts; alternatively use EXISTS."
  - left: agg_colony_daily
    right: fact_event
    type: asof
    on: "agg_colony_daily.colony_key = fact_event.colony_key AND agg_colony_daily.date >= fact_event.event_ts::DATE"

dimensions:
  time:
    table: dim_time
    key: time_key
    hierarchies:
      calendar: [year, month, date, hour]
      weekly: [year, week, date]
    levels:
      year: {label: year}
      month: {label: month, format: "YYYY-MM"}
      week: {label: week, note: "Monday of the ISO week"}
      date: {label: date}
      hour: {label: hour of day, note: "verify time zone before hour-of-day analysis"}
      season: {label: season, domain: from_data}
      is_beekeeping_season: {label: main beekeeping season, note: "April to August"}
  geography:
    table: dim_colony
    key: colony_key
    hierarchies:
      geo: [state, cell_id, colony_key]
    levels:
      state: {label: federal state, domain: from_data, note: "not populated yet (NULL) until states.geojson is loaded"}
      cell_id: {label: location, note: "0.1 degree cell, precision 5-7 km"}
      colony_key: {label: colony}
      colonies_in_cell: {label: number of colonies in the cell, note: "peer comparison needs >= 3"}
      ever_swarmed: {label: colony swarmed at least once, note: "filter value true/false; use this (not event_type) to select colonies that swarmed"}
      died: {label: colony died, note: "filter value true/false; use this (not event_type) to select colonies that died"}
  sensor:
    table: dim_sensor_position
    key: sensor_pos
    hierarchies:
      position: [zone, sensor_pos]
    levels:
      zone: {label: sensor zone, domain: from_data, note: "breakdowns by zone or sensor use measure temp_c from fact_temperature"}
      sensor_pos: {label: sensor, domain: from_data, note: "breakdowns by zone or sensor use measure temp_c from fact_temperature"}
  event:
    table: dim_event_type
    key: event_type
    hierarchies:
      cause: [cause_class, event_type]
    levels:
      cause_class: {label: cause class, domain: from_data}
      event_type: {label: event type, domain: from_data}

measures:
  weight_gain_kg:
    column: weight_gain_kg
    tables: [fact_hive_hourly, agg_colony_daily]
    label: weight gain
    unit: kg
    additivity: {time: [sum, avg, min, max], geography: [sum, avg, min, max]}
    description: Net weight gain excluding beekeeper interventions.
  weight_change_raw_kg:
    column: weight_change_raw_kg
    tables: [fact_hive_hourly]
    label: raw weight change
    unit: kg
    additivity: {time: [sum, min, max], geography: [avg, min, max]}
    description: Includes interventions (honey harvest, adding supers, stones).
  max_hourly_drop_raw_kg:
    column: max_hourly_drop_raw_kg
    tables: [agg_colony_daily]
    label: largest hourly raw weight drop
    unit: kg
    additivity: {time: [min, avg], geography: [min, avg]}
  weight_kg:
    column: weight_kg
    tables: [fact_hive_hourly]
    label: hive weight
    unit: kg
    additivity: {time: [avg, min, max, last], geography: [avg]}
    caveat: Includes the hive structure; do not compare levels between colonies.
  t_center:
    column: t_i_3
    tables: [fact_hive_hourly]
    label: center temperature
    unit: "°C"
    additivity: {time: [avg, median, min, max, stddev], geography: [avg, median, min, max]}
  t_off_center:
    columns: [t_i_1, t_i_2, t_i_4, t_i_5]
    tables: [fact_hive_hourly]
    label: off-center temperature
    unit: "°C"
    additivity: {time: [avg, median, min, max, stddev], geography: [avg, median, min, max]}
  t_outside:
    column: t_o
    tables: [fact_hive_hourly]
    label: outside temperature
    unit: "°C"
    additivity: {time: [avg, median, min, max, stddev], geography: [avg, median, min, max]}
  t_bme:
    column: t_bme
    tables: [fact_hive_hourly]
    label: in-hive temperature (BME280)
    unit: "°C"
    additivity: {time: [avg, median, min, max, stddev], geography: [avg, median, min, max]}
  t_diff_in_out:
    column: t_diff_in_out
    tables: [fact_hive_hourly]
    label: center minus outside temperature
    unit: "°C"
    additivity: {time: [avg, median, min, max], geography: [avg, median, min, max]}
  temp_c:
    column: temp_c
    tables: [fact_temperature]
    label: temperature at sensor position
    unit: "°C"
    additivity: {time: [avg, median, min, max, stddev], geography: [avg, median, min, max], sensor: [avg, min, max]}
  humidity:
    column: h
    tables: [fact_hive_hourly]
    label: in-hive relative humidity
    unit: "%"
    additivity: {time: [avg, median, min, max], geography: [avg, median, min, max]}
  pressure:
    column: p
    tables: [fact_hive_hourly]
    label: air pressure
    unit: hPa
    additivity: {time: [avg, min, max], geography: [avg, min, max]}
  t_center_avg:
    column: t_center_avg
    tables: [agg_colony_daily]
    label: daily mean center temperature
    unit: "°C"
    additivity: {time: [avg, min, max], geography: [avg, min, max]}
  t_center_std:
    column: t_center_std
    tables: [agg_colony_daily]
    label: daily center temperature variability
    unit: "°C"
    additivity: {time: [avg, max], geography: [avg, max]}
  t_diff_avg:
    column: t_diff_avg
    tables: [agg_colony_daily]
    label: daily mean center minus outside temperature
    unit: "°C"
    additivity: {time: [avg, min, max], geography: [avg, min, max]}
  h_avg:
    column: h_avg
    tables: [agg_colony_daily]
    label: daily mean humidity
    unit: "%"
    additivity: {time: [avg, min, max], geography: [avg, min, max]}
  n_hours:
    column: n_hours
    tables: [agg_colony_daily]
    label: hours with data
    unit: h
    additivity: {time: [sum, min, max, avg], geography: [sum, min, max, avg]}
    description: Data completeness of the day.

metrics:
  event_count:
    label: number of recorded events
    sql: "COUNT(*)"
    table: fact_event
    unit: count
    note: "filter by event_type for a specific event; recorded events only (incomplete)"
  colony_count:
    label: number of colonies
    sql: "COUNT(DISTINCT colony_key)"
    unit: count

rules:
  - {id: R1, enforced: true, text: "Aggregate every measure only with the functions listed in its additivity; temperatures, humidity and pressure are never summed."}
  - {id: R2, enforced: true, text: "Join fact_hive_hourly or agg_colony_daily with fact_event only via ASOF JOIN or EXISTS; a plain JOIN multiplies rows (fan trap)."}
  - {id: R3, enforced: true, text: "Filter dimension attributes only with values from their domain."}
  - {id: R4, enforced: false, text: "Do not compare weight_kg levels between colonies; compare weight gains."}
  - {id: R5, enforced: false, text: "Exclude days with n_hours < 20 from daily analyses."}
  - {id: R7, enforced: false, text: "dim_time has one row per hour; join it only on time_key (for agg_colony_daily and fact_event aggregate dim_time to date first or compute time levels from the date/timestamp directly)."}
  - {id: R6, enforced: false, text: "Peer comparison within a cell requires colonies_in_cell >= 3; otherwise use weather to separate colony and environment causes."}

examples:
  - id: EX1
    question: "Was the drop in weight gain on a given day shared by the whole location, or limited to some colonies?"
    pattern: peer_residual
    sql: |
      SELECT d.colony_key, d.date, c.cell_id,
             d.weight_gain_kg,
             avg(d.weight_gain_kg) OVER p                    AS cell_avg_kg,
             d.weight_gain_kg - avg(d.weight_gain_kg) OVER p AS residual_kg
      FROM agg_colony_daily AS d
      JOIN dim_colony AS c ON d.colony_key = c.colony_key
      WHERE c.colonies_in_cell >= 3 AND d.n_hours >= 20
      WINDOW p AS (PARTITION BY c.cell_id, d.date)
      ORDER BY abs(residual_kg) DESC
  - id: EX2
    question: "Show the daily weight gain at every level of the geography hierarchy."
    pattern: rollup_cube
    sql: |
      SELECT d.date, c.state, c.cell_id, d.colony_key,
             avg(d.weight_gain_kg) AS avg_gain_kg,
             count(*)              AS n_colonies,
             GROUPING(c.state, c.cell_id, d.colony_key) AS level_mask  -- 0 colony, 1 cell, 3 state, 7 total
      FROM agg_colony_daily AS d
      JOIN dim_colony AS c ON d.colony_key = c.colony_key
      WHERE d.n_hours >= 20
      GROUP BY d.date, ROLLUP (c.state, c.cell_id, d.colony_key)
  - id: EX3
    question: "Which recorded event preceded the largest daily weight drops?"
    pattern: asof_event_context
    sql: |
      SELECT d.colony_key, d.date, d.max_hourly_drop_raw_kg,
             e.event_type, e.event_ts, et.cause_class
      FROM agg_colony_daily AS d
      ASOF LEFT JOIN fact_event AS e
        ON d.colony_key = e.colony_key AND d.date >= e.event_ts::DATE
      LEFT JOIN dim_event_type AS et ON e.event_type = et.event_type
      WHERE d.n_hours >= 20
      ORDER BY d.max_hourly_drop_raw_kg
      LIMIT 20
  - id: EX4
    question: "How variable was the center temperature in the three weeks before recorded swarming events?"
    pattern: exists_event_window
    sql: |
      SELECT d.colony_key,
             avg(d.t_center_std) AS avg_daily_t_center_std,
             count(*)            AS n_days
      FROM agg_colony_daily AS d
      WHERE d.n_hours >= 20
        AND EXISTS (
          SELECT 1
          FROM fact_event AS e
          WHERE e.colony_key = d.colony_key
            AND e.event_type = 'swarming'
            AND d.date BETWEEN e.event_ts::DATE - INTERVAL 21 DAY
                           AND e.event_ts::DATE - INTERVAL 1 DAY
        )
      GROUP BY d.colony_key

starters:
  - {label: "Brood nest temperature by month", message: "What is the average center temperature by month?"}
  - {label: "Nectar flow by season", message: "How much honey flow was there per season?"}
  - {label: "Swarming events per year", message: "How many swarming events were recorded per year?"}
  - {label: "Sensor position drill-down", message: "Compare the average temperature at each sensor position"}
