[project]
name = "diplomka"
version = "0.1.0"
description = "LLM analytics agent (LangGraph + Chainlit + DuckDB) over the Olist e-commerce dataset."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "chainlit>=2.11.1",
    "duckdb>=1.5.4",
    "fastapi>=0.139.2",
    "langchain-anthropic>=1.4.8",
    "langchain-huggingface>=1.2.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.9",
    "pandas>=3.0.3",
    "plotly>=6.9.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "sentence-transformers>=5.6.0",
    "uvicorn>=0.51.0",
]

[project.scripts]
diplomka = "diplomka.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diplomka"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120
src = ["src", "scripts", "apps", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The evaluation dataset is a table of long, one-line test cases; wrapping hurts readability.
"src/diplomka/eval.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: integration tests that call the LLM and DuckDB",
]
