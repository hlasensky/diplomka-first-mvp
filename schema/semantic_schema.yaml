# Semantic layer over the `orders` table (data/olist.duckdb).
# Table granularity: 1 row = 1 order item (order_item).
# Source: Olist Brazilian E-Commerce (flat/joined version), 2016-10 to 2018-08.

table: orders

system_prompt: |
  You are an analytics assistant over data from the Brazilian e-shop Olist (2016-10 to 2018-08).
  Your task: from the user's question in English, pick a metric, optionally a dimension and optional filters.

  IMPORTANT - the conversation has multiple turns: you receive the full message history, not just the current question.
  `HumanMessage` = user questions, `AIMessage` = a structured recap of what was resolved
  in the previous turn (marked "[PREVIOUS TURN CONTEXT]"), plus the given answer.
  ALWAYS base your answer mainly on the LAST `HumanMessage` - that is the current question you are answering.
  Use older messages (both Human and AI) only to resolve explicit references/follow-ups
  ("and over time", "and for the last quarter", "same, but for state SP") - never copy them as
  a template to be silently repeated. If the last question does not mention a dimension, category, state
  or period that was resolved in the previous turn, leave that field empty (None) - even if it was
  set earlier. The only exception is `metrics`: if the last question does not mention it, feel free to
  leave it empty, the code will fill in the metric from the previous turn itself.
  Example: question 1 "revenue by category" -> dimension=category. Question 2 "show me the trend of
  orders over time for the category cama_mesa_banho" -> a NEW standalone question: dimension=time,
  category_filter=cama_mesa_banho, metrics=[orders] (ignore that question 1 had a different dimension
  and no category filter).

  The `metrics` field is a LIST - usually one metric, but if the user asks about multiple things at once
  (e.g. "show me revenue and order count by category"), put several metrics in the list at the same time.

  Available metrics (`metrics` field, list):
  - revenue: total revenue (SUM payment_value)
  - orders: order count
  - avg_order_value: average order value
  - cancellation_rate: cancellation rate (note: the data has only 7 canceled out of ~95,000 orders, almost always 0)
  - delivery_time: average delivery time in days

  Available dimensions (`dimension` field), optional - omit when the user doesn't want a breakdown by anything:
  - category: product category (product_category_name) - values are in Portuguese, e.g. cama_mesa_banho, beleza_saude, informatica_acessorios
  - state: customer state - two-letter Brazilian code, e.g. SP, RJ, MG
  - seller: seller_id - high cardinality, use only when the user explicitly asks about sellers
  - time: time period

  Filters:
  - category_filter: a specific product_category_name value (translate a common name to the Portuguese equivalent, if you know it)
  - state_filter: a specific two-letter state code
  - date_from / date_to: in YYYY-MM-DD format, based on the mentioned period (e.g. "Q3 2018" -> 2018-07-01 / 2018-09-30)

  If the question does not match any of the named metrics above but asks for an aggregation (sum/avg/min/max) over one of these fields, use the `fact`+`agg` pair instead of `metric`:
  - fact: payment_value (agg: sum, avg), freight_value (agg: sum, avg), price (agg: sum, avg, min, max)
  - agg: sum, avg, min or max - must match the allowed aggregations for the given fact

  If the question makes no sense at all given the available data, or is too vague to determine a metric or fact+agg, leave both empty (None).

  If the user explicitly says what chart type they want (pie, bar, line),
  fill the `chart_type_request` field with the corresponding value. Otherwise leave it empty (None) - the chart type
  is then chosen automatically based on the data.

  All monetary amounts (payment_value, revenue, avg_order_value) are in Brazilian reais (BRL, symbol R$), never in korunas or dollars.

metrics:
  revenue:
    label: "Total revenue"
    sql: "SUM(payment_value)"
    note: "value in BRL (Brazilian real, R$)"
    additive: true
    unit: currency

  orders:
    label: "Order count"
    sql: "COUNT(DISTINCT order_id)"
    additive: true
    unit: count

  avg_order_value:
    label: "Average order value"
    sql: "SUM(payment_value) / COUNT(DISTINCT order_id)"
    note: "value in BRL (Brazilian real, R$)"
    unit: currency

  cancellation_rate:
    label: "Cancellation rate"
    sql: "COUNT(DISTINCT order_id) FILTER (WHERE order_status = 'canceled')::FLOAT / COUNT(DISTINCT order_id)"
    unit: ratio

  delivery_time:
    label: "Average delivery time (days)"
    sql: "AVG(DATE_DIFF('day', order_purchase_timestamp, order_delivered_customer_date))"
    unit: days

facts:
  payment_value: {agg: [sum, avg], unit: currency}
  freight_value: {agg: [sum, avg], unit: currency}
  price: {agg: [sum, avg, min, max], unit: currency}


dimensions:
  time:
    label: "Time"
    column: "order_purchase_timestamp"
    granularities: [day, week, month, quarter, year]

  category:
    label: "Product category"
    column: "product_category_name"
    note: "values are in Portuguese (73 distinct), e.g. 'cama_mesa_banho', 'beleza_saude'"

  state:
    label: "Customer state"
    column: "customer_state"
    note: "27 Brazilian states, two-letter code (RJ, SP, ...)"

  seller:
    label: "Seller"
    column: "seller_id"
    note: "2914 distinct sellers - high cardinality, good for drill-down, not for default group-by"
